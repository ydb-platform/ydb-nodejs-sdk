name: SLO 2DC

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main

jobs:
  ydb-slo-action-2dc:
    if: contains(github.event.pull_request.labels.*.name, 'SLO')

    name: Run YDB 2DC SLO Tests (${{ matrix.sdk.name }})
    runs-on: "large-runner-js-sdk"
    timeout-minutes: 45

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        sdk:
          - name: node-kv
            image: node
            command: --setup=kv.setup --teardown=kv.teardown --worker=kv.read --worker=kv.write
          - name: bun-kv
            image: oven/bun
            command: --setup=kv.setup --teardown=kv.teardown --worker=kv.read --worker=kv.write

    concurrency:
      group: slo-2dc-${{ github.ref }}-${{ matrix.sdk.name }}
      cancel-in-progress: true

    steps:
      - name: Update deps
        run: |
          sudo apt update
          sudo apt install libatomic1

      - name: Install dependencies
        run: |
          YQ_VERSION=v4.48.2
          BUILDX_VERSION=0.30.1
          COMPOSE_VERSION=2.40.3

          sudo curl -L https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -o /usr/local/bin/yq && \
            sudo chmod +x /usr/local/bin/yq

          echo "Updating Docker plugins..."
          sudo mkdir -p /usr/local/lib/docker/cli-plugins

          echo "Installing Docker Buildx ${BUILDX_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          echo "Installing Docker Compose ${COMPOSE_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          echo "Installed versions:"
          yq --version
          docker --version
          docker buildx version
          docker compose version

      - name: Checkout current version
        uses: actions/checkout@v7
        with:
          path: current
          fetch-depth: 0

      - name: Determine baseline commit
        id: baseline
        run: |
          cd "$GITHUB_WORKSPACE/current"
          BASELINE=$(git merge-base HEAD origin/main)
          echo "sha=$BASELINE" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$BASELINE" origin/main && \
             [ "$(git rev-parse origin/main)" = "$BASELINE" ]; then
            BASELINE_REF="main"
          else
            BRANCH=$(git branch -r --contains "$BASELINE" | grep -v HEAD | head -1 | sed 's/.*\///' || echo "")
            if [ -n "$BRANCH" ]; then
              BASELINE_REF="${BRANCH}@${BASELINE:0:7}"
            else
              BASELINE_REF="${BASELINE:0:7}"
            fi
          fi
          echo "ref=$BASELINE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout baseline version
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Build current workload image
        run: |
          npm --prefix "$GITHUB_WORKSPACE/current" ci
          npm --prefix "$GITHUB_WORKSPACE/current" run build

          docker build \
            --build-arg image=${{ matrix.sdk.image }} \
            -t "ydb-app-current" \
            "$GITHUB_WORKSPACE/current/tests/slo"

      - name: Build baseline workload image
        run: |
          npm --prefix "$GITHUB_WORKSPACE/baseline" ci
          npm --prefix "$GITHUB_WORKSPACE/baseline" run build

          docker build \
            --build-arg image=${{ matrix.sdk.image }} \
            -t "ydb-app-baseline" \
            "$GITHUB_WORKSPACE/baseline/tests/slo"

      - name: Run 2DC SLO Tests
        uses: ydb-platform/ydb-slo-action/init@5e5881d2ba90a6b09aa4529e1a8c0054e78a4683
        timeout-minutes: 35
        with:
          github_issue: ${{ github.event.pull_request.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workload_name: ${{ matrix.sdk.name }}-2dc
          workload_duration: "900"
          fail_on_workload_error: "true"
          workload_current_ref: ${{ github.head_ref || github.ref_name }}
          workload_current_image: ydb-app-current
          workload_current_command: >-
            ${{ matrix.sdk.command }}
            --kv.read.rps=1000
            --kv.write.rps=100
          workload_baseline_ref: ${{ steps.baseline.outputs.ref }}
          workload_baseline_image: ydb-app-baseline
          workload_baseline_command: >-
            ${{ matrix.sdk.command }}
            --kv.read.rps=1000
            --kv.write.rps=100
          bridge_mode: "true"

  report-2dc:
    if: >-
      ${{ !cancelled() && contains(github.event.pull_request.labels.*.name, 'SLO') &&
      needs.ydb-slo-action-2dc.result != 'skipped' }}
    needs: ydb-slo-action-2dc
    name: Publish YDB 2DC SLO Report
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Publish YDB 2DC SLO Report
        uses: ydb-platform/ydb-slo-action/report@5e5881d2ba90a6b09aa4529e1a8c0054e78a4683
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_run_id: ${{ github.run_id }}
          github_issue: ${{ github.event.pull_request.number }}
          post_comment: "false"
          fail_on_threshold: "false"
